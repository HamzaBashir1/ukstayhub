name: ukstayhub
description: UK Stay Hub – book stays across London with no hidden fees. Guest + host app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking + storage
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_widget_from_html_core: ^0.15.1

  # Platform
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

  intl: any
  phone_numbers_parser: ^9.0.29
  printing: ^5.15.1
  flutter_web_auth_2: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/data/
    - assets/images/
    - assets/images/destinations/
